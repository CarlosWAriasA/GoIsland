name: Deploy backend

# Despliega la API a Azure App Service como contenedor en cada commit a main que toque
# el backend. El despliegue solo ocurre si las pruebas pasan.
#
# No se guarda ningun secreto de larga duracion: la imagen se publica en GitHub Container
# Registry con el GITHUB_TOKEN del propio job, y Azure se autentica por OIDC contra una
# identidad que solo confia en este repositorio.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  IMAGE: ghcr.io/carloswariasa/goisland-api
  AZURE_RESOURCE_GROUP: goisland-rg

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: goisland_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goisland_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Las pruebas de integracion usan esta base efimera, nunca la de produccion.
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=goisland_tests;Username=postgres;Password=postgres
      # Clave de firma solo para la ejecucion efimera de pruebas. No es un secreto: no protege
      # ningun ambiente real y se descarta al terminar el job.
      Jwt__Key: clave-de-pruebas-sin-valor-en-produccion-0123456789abcdef
      Jwt__Issuer: goisland-tests
      Jwt__Audience: goisland-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore backend/GoIsland.Api.Tests/GoIsland.Api.Tests.csproj
      - run: dotnet test backend/GoIsland.Api.Tests/GoIsland.Api.Tests.csproj --configuration Release --no-restore

  deploy:
    name: Publicar en Azure
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Autenticarse en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apuntar el Web App a la imagen nueva
        run: |
          # La etiqueta es el SHA del commit, asi que cada despliegue es rastreable y
          # App Service siempre baja una imagen distinta en vez de reusar la cacheada.
          az webapp config appsettings set \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings WEBSITES_PORT=8080 \
            --output none

          az webapp config container set \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-image-name "${{ env.IMAGE }}:${{ github.sha }}" \
            --output none

          az webapp restart \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

      - name: Comprobar que la API responde
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health/ready"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then
              echo "La API responde correctamente."
              exit 0
            fi
            echo "Intento $attempt: respuesta $code; se reintenta en 15s."
            sleep 15
          done
          echo "La API no respondio 200 en /api/health/ready tras el despliegue."
          exit 1
