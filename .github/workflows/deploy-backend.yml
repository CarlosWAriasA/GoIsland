name: Deploy backend

# Despliega la API a Azure App Service en cada commit a main que toque el
# backend. El despliegue solo ocurre si las pruebas pasan.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PUBLISH_DIR: ${{ github.workspace }}/publish

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: goisland_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goisland_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Las pruebas de integracion usan esta base efimera, nunca la de produccion.
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=goisland_tests;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore backend/GoIsland.Api.Tests/GoIsland.Api.Tests.csproj
      - run: dotnet test backend/GoIsland.Api.Tests/GoIsland.Api.Tests.csproj --configuration Release --no-restore

  deploy:
    name: Publicar en Azure
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Compilar y publicar
        run: >-
          dotnet publish backend/GoIsland.Api/GoIsland.Api.csproj
          --configuration Release
          --output "$PUBLISH_DIR"
          /p:UseAppHost=false

      - name: Desplegar en App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}

      - name: Comprobar que la API responde
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}/api/health/ready"
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then
              echo "La API responde correctamente."
              exit 0
            fi
            echo "Intento $attempt: respuesta $code; se reintenta en 15s."
            sleep 15
          done
          echo "La API no respondio 200 en /api/health/ready tras el despliegue."
          exit 1
